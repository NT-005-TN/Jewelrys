spring:
  application:
    name: jewelry-workshop-api

  datasource:
    url: jdbc:postgresql://localhost:5432/jewelry_workshop
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        default_batch_fetch_size: 64
        jdbc:
          batch_size: 20
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: true
  data:
    redis:
      host: localhost
      port: 6379
      # password: redis-password
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  security:
    password:
      min-length: 6
      client-change-min-length: 8
server:
  port: 8080
  servlet:
    context-path: /api

logging:
  pattern:
    level: "%5p [requestId=%X{requestId}]"
  level:
    com.jewelry.workshop: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080/api}
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration: 900000
    refresh:
      expiration: 604800000
  init:
    admin:
      username: ${ADMIN_USERNAME:admin}
      email: ${ADMIN_EMAIL:admin@jewelry.local}
      password: ${ADMIN_PASSWORD:}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
