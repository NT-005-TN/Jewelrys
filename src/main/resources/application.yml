spring:
  application:
    name: jewelry-workshop-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jewelry_workshop}
    username: ${DB_USERNAME:jewelry}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
      validation-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 20
          time_zone: UTC
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
            required: ${MAIL_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s

  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  shutdown: graceful
  forward-headers-strategy: none
  error:
    include-message: never
    include-stacktrace: never

logging:
  level:
    root: INFO
    com.jewelry.workshop: ${APP_LOG_LEVEL:INFO}
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: OFF

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
    path: /api-docs
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:false}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080/api}
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:jewelry-workshop-api}
    audience: ${JWT_AUDIENCE:jewelry-workshop-clients}
    expiration: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh:
      expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  security:
    trust-forwarded-headers: ${TRUST_FORWARDED_HEADERS:false}
    password:
      min-length: 12
      max-length: 128
  init:
    admin:
      enabled: ${ADMIN_INIT_ENABLED:false}
      username: ${ADMIN_USERNAME:}
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
