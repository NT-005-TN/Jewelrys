<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>Новый пароль</title>
<style>body{font:18px system-ui;max-width:440px;margin:12vh auto;padding:24px;background:#faf8f4;color:#29241e}label,input,button{display:block;width:100%;box-sizing:border-box}input,button{padding:12px;margin:12px 0}button{background:#29241e;color:white;border:0;border-radius:6px}p{line-height:1.5}</style>
<h1>Новый пароль</h1><form id="reset"><label>Пароль (от 8 до 72 символов)<input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required></label>
<label>Повторите пароль<input id="confirm" type="password" autocomplete="new-password" required></label><button>Сохранить пароль</button></form><p id="message" role="status"></p>
<script>
const token=new URLSearchParams(location.hash.slice(1)).get('token');
history.replaceState(null,'',location.pathname);
const form=document.querySelector('#reset'), message=document.querySelector('#message');
if(!token){form.hidden=true;message.textContent='Откройте ссылку из письма для сброса пароля.';}
form.addEventListener('submit',async e=>{e.preventDefault();
const password=document.querySelector('#password').value;
if(password!==document.querySelector('#confirm').value){message.textContent='Пароли не совпадают.';return;}
const button=form.querySelector('button');button.disabled=true;
try{const response=await fetch('reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,newPassword:password})});
if(response.ok){form.hidden=true;message.textContent='Пароль изменён. Войдите с новым паролем.';}
else{message.textContent='Не удалось изменить пароль. Ссылка могла истечь; запросите новое письмо.';}}
catch{message.textContent='Ошибка соединения. Попробуйте ещё раз.';}finally{button.disabled=false;}});
</script></html>
